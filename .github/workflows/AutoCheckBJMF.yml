name: AutoCheckBJMF
on:
  workflow_dispatch:
  schedule:
    - cron: '37 13 * * *'   # 北京时间 21:37（错峰，更准时）
    - cron: '52 13 * * *'   # 北京时间 21:52 保险
    - cron: '7 14 * * *'    # 北京时间 22:07 保险
    - cron: '22 14 * * *'   # 北京时间 22:22 保险
env:
    ClassID: ${{ secrets.ClassID }}
    X: ${{ secrets.X }}
    Y: ${{ secrets.Y }}
    ACC: ${{ secrets.ACC }}
    SearchTime: ${{ secrets.SEARCHTIME }}
    MyCookie: ${{ secrets.MYCOOKIE }}
    token: ${{ secrets.TOKEN }}
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up env
        run: |
          pip install requests beautifulsoup4 schedule
      - name: Checkin
        run: |
          python main.py
