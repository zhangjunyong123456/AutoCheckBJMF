name: AutoCheckBJMF
on:
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * *'   # 北京时间 21:30
    - cron: '45 13 * * *'   # 北京时间 21:45
    - cron: '0 14 * * *'    # 北京时间 22:00
    - cron: '15 14 * * *'   # 北京时间 22:15
env:
    ClassID: ${{ secrets.ClassID }}
    X: ${{ secrets.X }}
    Y: ${{ secrets.Y }}
    ACC: ${{ secrets.ACC }}
    SearchTime: ${{ secrets.SEARCHTIME }}
    MyCookie: ${{ secrets.MYCOOKIE }}
    token: ${{ secrets.TOKEN }}
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Set up env
        run: |
          pip install requests beautifulsoup4 schedule
      - name: Checkin
        run: |
          python main.py
